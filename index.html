<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Idols Venue - Ticketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
      <h1>Idols Venue</h1>
      <h3>World Tour - Live Concert</h3>
  </header>

  <main id="app">
      <div id="map-area">
          <p id="status">Loading venue...</p>
      </div>
      <aside id="details-panel" class="hidden">
          <h2>Seat Details</h2>
          <div id="seat-info">
              <p>No seat selected.</p>
          </div>
          <div class="price-total">
              <span>Price:</span>
              <span id="seat-price">$0</span>
          </div>
          <button id="add-to-cart" disabled>ADD TO CART</button>
      </aside>
  </main>

<script src="js/venue-data.js"></script>
<script src="js/venue-render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
